<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rabbit Farm Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { background-color: #4CAF50; color: white; padding: 15px 20px; text-align: center; width: 100%; box-sizing: border-box; }
        .header h1 { margin: 0; }
        .login-container { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 50px; width: 100%; max-width: 400px; }
        .login-container h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input[type="text"],
        .form-group input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .login-button { background-color: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        .login-button:hover { background-color: #45a049; }
        .message { padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center; }
        .error-message { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .logout-message { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .extra-links { text-align: center; margin-top: 20px; }
        .extra-links a { color: #4CAF50; text-decoration: none; }
        .extra-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Rabbit Farm Management</h1>
    </div>

    <div class="login-container">
        <h2>User Login</h2>

        <!-- Display error message if login fails -->
        <div th:if="${param.error}" class="message error-message">
            Invalid username or password. Please try again.
        </div>

        <!-- Display message if user logged out -->
        <div th:if="${param.logout}" class="message logout-message">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required autofocus />
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required />
            </div>
            <div>
                <button type="submit" class="login-button">Log In</button>
            </div>
        </form>
        <div class="extra-links">
            <!-- <p>Don't have an account? <a th:href="@{/register}">Register here</a></p> --> <!-- Placeholder if a registration page is added -->
            <p>Don't have an account? Contact administrator. (Registration via API: /api/auth/register)</p>
            <p><a th:href="@{/}">Back to Dashboard (if logged in)</a></p>
        </div>
    </div>

</body>
</html>
