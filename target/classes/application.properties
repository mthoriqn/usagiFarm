# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:rabbitfarmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password= # Or use 'password' if preferred, but empty is common for H2 default 'sa' user

# JPA/Hibernate Configuration for H2
# Use 'create' or 'create-drop' for in-memory db. 'create' is fine for development.
# 'create-drop' is good if you want a fresh start every time and ensure db is cleaned up.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
# Show SQL queries in logs (good for development)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
# Format SQL logs

# H2 Console (Optional, but very useful for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# To access H2 console, navigate to http://localhost:<port>/h2-console
# Ensure the JDBC URL in the H2 console login page matches: jdbc:h2:mem:rabbitfarmdb

# Server port (optional, default is 8080)
# server.port=8080
